server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 512k;
    resolver 10.110.32.10 valid=30s ipv6=off;
    resolver_timeout 3s;
    add_header Referrer-Policy same-origin always;
    location ~ ^/api/(auth|launch)/ {
        set $account_backend dinfritid-api.dinfritid-production.svc.cluster.local:8080;
        proxy_pass http://$account_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_hide_header X-Powered-By;
        add_header Cache-Control 'no-store' always;
        add_header Referrer-Policy no-referrer always;
    }
    location = /konto {
        try_files $uri /index.html;
        add_header Cache-Control 'no-store';
        add_header Referrer-Policy no-referrer always;
    }
    location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
    location = /_release.json { add_header Cache-Control 'no-store'; }
    location / { try_files $uri $uri/ /index.html; }
}
